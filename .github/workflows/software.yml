name: Software
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: software-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Allocate semantic version and synchronize badges
        id: version
        run: python tools/ci_version.py
      - name: Test and check version
        run: |
          chmod +x gradlew
          python version_gate.py
          python -m unittest discover -s tools -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest
      - name: Build Android beta or stable APK
        run: ./gradlew :app:assembleDebug
      - name: Package and verify delivered APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p package/Android
          cp app/build/outputs/apk/debug/app-debug.apk "package/Android/Kalam_${VERSION}.apk"
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "package/Android/Kalam_${VERSION}.apk")
          echo "$BADGING" | head -1
          echo "$BADGING" | grep "versionCode='$CODE' versionName='$VERSION'"
          (cd package && zip -r "../Kalam_${VERSION}.zip" Android)
      - name: Upload the single platform archive
        uses: actions/upload-artifact@v4
        with:
          name: Kalam_${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error
      - name: Publish stable release after merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" "Kalam_${VERSION}.zip" --target "$GITHUB_SHA" --title "Kalam v$VERSION" --generate-notes
