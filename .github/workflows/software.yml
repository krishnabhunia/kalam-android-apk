name: Software
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish this branch as an optional GitHub beta release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: software-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Allocate semantic version and synchronize badges
        id: version
        env:
          PUBLISH_BETA: ${{ inputs.publish_beta }}
        run: python tools/ci_version.py
      - name: Test and check version
        run: |
          chmod +x gradlew
          python version_gate.py
          python -m unittest discover -s tools -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease
      - name: Sign with the permanent Android key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/sign_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk "package/Android/Kalam_${VERSION}.apk"
      - name: Verify and package the delivered APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "package/Android/Kalam_${VERSION}.apk")
          echo "$BADGING" | head -1
          echo "$BADGING" | grep "versionCode='$CODE' versionName='$VERSION'"
          (cd package && zip -r "../Kalam_${VERSION}.zip" Android)
      - name: Upload exactly one directly downloadable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Kalam_${{ steps.version.outputs.version }}.zip
          path: Kalam_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false
  publish:
    needs: android
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_beta)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: Kalam_${{ needs.android.outputs.version }}.zip
          path: release
          skip-decompress: true
      - name: Publish stable or explicitly requested beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
          CODE: ${{ needs.android.outputs.code }}
          RELEASE_DATE: ${{ needs.android.outputs.date }}
          TARGET: ${{ github.sha }}
          BETA: ${{ github.event_name == 'workflow_dispatch' }}
        run: python tools/publish_release.py
